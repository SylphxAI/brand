name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce GitHub-hosted runners (public repository)
        run: |
          set -euo pipefail
          # A public repository never runs on Sylphx self-hosted runners: its
          # fork pull requests would execute on them (2026-09-24 decision).
          if grep -rnE '^[[:space:]]*runs-on:.*(self-hosted|sylphx-)' .github/workflows; then
            echo "::error::public repository workflows must use GitHub-hosted runners"
            exit 1
          fi
      - name: Validate JSON files
        run: python3 scripts/validate_json.py
