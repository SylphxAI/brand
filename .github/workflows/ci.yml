name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      # All CI runs on our own runners; the GitHub budget is $0 (owner
      # standards/dx.md, owner#746).
      - name: No GitHub-hosted runner labels
        run: |
          if grep -rnE '(ubuntu|windows|macos)-(latest|[0-9]+)' .github/workflows | grep -v '^[^:]*:[0-9]*:[[:space:]]*#'; then
            echo "::error::GitHub-hosted runner label found; use sylphx-linux-standard"
            exit 1
          fi
      - name: Validate JSON files
        run: python3 scripts/validate_json.py
