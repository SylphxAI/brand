name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # owner#750 (zero metered GitHub spend): a public repository may use
      # GitHub's free standard hosted runners; larger and GPU hosted runners
      # are banned everywhere.
      - name: No larger or GPU GitHub-hosted runners
        run: |
          if grep -rnE '(ubuntu|windows|macos)-[a-z0-9.-]*(cores|xlarge|large|gpu)' .github/workflows | grep -v '^[^:]*:[0-9]*:[[:space:]]*#'; then
            echo "::error::larger or GPU GitHub-hosted runners are banned (owner#750)"
            exit 1
          fi
      - name: Validate JSON files
        run: python3 scripts/validate_json.py
      - name: Tokens CSS matches its source
        run: python3 scripts/build_tokens.py --check
      - name: Shipped files match the manifest
        run: python3 scripts/manifest.py --check
      # The manifest proves the files are the ones recorded; this proves the
      # generator still draws them. A hand-edited or traced file fails here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: The generator redraws every logo file byte for byte
        run: |
          python -m pip install --quiet -r logo/construction/requirements.txt
          python logo/construction/mark.py
          if ! git diff --exit-code --stat -- logo || [ -n "$(git status --porcelain -- logo)" ]; then
            git status --porcelain -- logo
            echo "::error::logo/ differs from what logo/construction/mark.py draws; edit mark.spec.json or mark.py and regenerate, never the files"
            exit 1
          fi
